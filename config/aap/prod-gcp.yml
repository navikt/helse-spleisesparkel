apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: sparkel-aap
  namespace: tbd
  labels:
    team: tbd
spec:
  image: "{{image}}"
  port: 8080
  liveness:
    path: isalive
    initialDelay: 5
  readiness:
    path: isready
    initialDelay: 5
  preStopHook:
    http:
      path: /stop
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
  resources:
    limits:
      memory: 1Gi
      cpu: 2000m
    requests:
      cpu: 50m
      memory: 320Mi
  replicas:
    min: 4
    max: 8
    cpuThresholdPercentage: 400
  strategy:
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 2
  kafka:
    pool: nav-prod
  azure:
    application:
      enabled: true
      tenant: nav.no
  prometheus:
    enabled: true
    path: /metrics
  webproxy: true
  vault:
    enabled: true
  env:
    - name: KAFKA_CONSUMER_GROUP_ID
      value: tbd-sparkel-aap-v1
    - name: KAFKA_RAPID_TOPIC
      value: tbd.rapid.v1
    - name: AAP_API_BASE_URL
      value: http://api-intern.aap
    - name: ACCESS_TOKEN_SCOPE
      value: api://prod-gcp.aap.api-intern/.default
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
        - application: api-intern
          namespace: aap
          cluster: prod-gcp
