spec:
  resources:
    requests:
      cpu: 50m
  replicas:
    min: 4
    max: 8
  kafka:
    pool: nav-prod
  azure:
    application:
      tenant: nav.no
  env:
    - name: ACCESS_TOKEN_SCOPE
      value: api://prod-gcp.aap.api-intern/.default
  accessPolicy:
    outbound:
      rules:
        - application: api-intern
          namespace: aap
          cluster: prod-gcp
